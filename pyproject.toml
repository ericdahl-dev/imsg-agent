[project]
name = "imsg-read"
version = "0.1.0"
description = "Read a single iMessage thread from chat.db, decoded and scoped"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
imsg-read = "imsgread:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["imsgread"]
