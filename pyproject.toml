[project]
name = "imsg-agent"
version = "0.1.0"
description = "Scoped iMessage read/send for agents - decodes chat.db, marks agent-sent messages"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
imsg-agent = "imsgread:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["imsgread"]
