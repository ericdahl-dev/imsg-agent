name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS because that is the only platform this tool targets: it reads
    # Apple's chat.db and sends through Messages.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Exactly the commands the README tells a new user to run. If the README
      # drifts from what actually works on a clean machine, this fails.
      - name: Install as documented
        run: pip install -e '.[dev]'
      - name: Test
        run: python3 -m pytest -q

      - name: Console script is on PATH
        run: imsg-agent --version

  clean-install:
    # A non-editable install once resolved contacts.toml inside site-packages,
    # where a user cannot keep one and an upgrade would wipe it. Pin that shut.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install non-editable into a fresh venv
        run: |
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install .
          /tmp/v/bin/imsg-agent --version
      - name: Missing contacts point at a writable config path
        run: |
          out=$(HOME=/tmp/empty /tmp/v/bin/imsg-agent --contacts 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '.config/imsg-agent/contacts.toml' \
            || { echo "::error::did not suggest the user config directory"; exit 1; }
          echo "$out" | head -1 | grep -q 'site-packages' \
            && { echo "::error::told the user to write into site-packages"; exit 1; }
          exit 0
